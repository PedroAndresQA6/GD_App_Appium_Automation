[pytest]
minversion = 6.0
addopts = -v -s --strict-markers
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    smoke: Pruebas rápidas de smoke test
    regression: Pruebas de regression completa
    login: Tests relacionados con login
    navigacion: Tests de navegacion
    medicamentos: Tests de medicamentos
    dependientes: Tests de dependientes
    perfil: Tests de perfil
    medicos: Tests de medicos
    consultas: Tests de consultas
    estudios: Tests de estudios

filterwarnings =
    ignore::DeprecationWarning

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

junit_family = xunit2